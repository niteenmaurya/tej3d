name: tej3d
description: Zero-dependency custom 3D game engine for Flutter (C++17 PBR, physics, audio/VoIP, WASM, and Unity-style workflow).
version: 0.35.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.thropix.tej3d
        pluginClass: Tej3dPlugin